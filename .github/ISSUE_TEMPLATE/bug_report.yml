name: Bug report
description: Something is broken or behaving incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
  - type: input
    id: ref
    attributes:
      label: Reference / request ID (if any)
      description: A RoSentry ref (LOG-…, AP-…) or request id helps us trace it.
